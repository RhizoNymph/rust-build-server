[package]
name = "rbs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gethostname = "1.1.0"
rbs-config = { version = "0.1.0", path = "../rbs-config" }
rbs-proto = { version = "0.1.0", path = "../rbs-proto" }
rbs-server = { version = "0.1.0", path = "../rbs-server" }
rbs-setup = { version = "0.1.0", path = "../rbs-setup" }
rbs-store = { version = "0.1.0", path = "../rbs-store" }
rbs-sync = { version = "0.1.0", path = "../rbs-sync" }
rbs-toolchain = { version = "0.1.0", path = "../rbs-toolchain" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
