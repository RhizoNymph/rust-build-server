rust-version.workspace = true

[dependencies]
rbs-config = { version = "0.1.0", path = "../rbs-config" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
