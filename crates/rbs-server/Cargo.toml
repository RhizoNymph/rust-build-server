[package]
name = "rbs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["fs", "signal", "hostname"] }
rbs-config = { version = "0.1.0", path = "../rbs-config" }
rbs-proto = { version = "0.1.0", path = "../rbs-proto" }
rbs-toolchain = { version = "0.1.0", path = "../rbs-toolchain" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs", "io-std"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
