[package]
name = "rbs-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
object_store = { version = "0.14.1", features = ["aws"] }
rbs-config = { version = "0.1.0", path = "../rbs-config" }
rbs-sync = { version = "0.1.0", path = "../rbs-sync" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
